<!DOCTYPE html>
<html>
<head>
  <title>Nutrition Tracker</title>
</head>
<body>
  <h1>Foods</h1>

  <h2>Add a Food</h2>
    <input id="input-name" placeholder="name">
    <input id="input-calories" placeholder="calories" type="number">
    <input id="input-protein" placeholder="protein" type="number">
    <input id="input-carbs" placeholder="carbs" type="number">
    <input id="input-fat" placeholder="fat" type="number">
    <button onclick="addFood()">Add Food</button>


  <h2>Log a Meal</h2>
<input id="meal-type" placeholder="meal type (e.g. breakfast)">

<div>
  <input id="item-food-id-1" placeholder="food id" type="number">
  <input id="item-quantity-1" placeholder="quantity" type="number">
</div>
<div>
  <input id="item-food-id-2" placeholder="food id" type="number">
  <input id="item-quantity-2" placeholder="quantity" type="number">
</div>
<div>
  <input id="item-food-id-3" placeholder="food id" type="number">
  <input id="item-quantity-3" placeholder="quantity" type="number">
</div>

<button onclick="logMeal()">Log Meal</button>

<h2>Today's Stats</h2>
    <p>Calories: <span id="stat-calories"></span></p>
    <p>Protein: <span id="stat-protein"></span>g</p>
    <p>Carbs: <span id="stat-carbs"></span>g</p>
    <p>Fat: <span id="stat-fat"></span>g</p>


  <ul id="food-list"></ul>


  <script src="script.js"></script>
</body>
</html>
